<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Similia Stock</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="brand"><i data-lucide="leaf"></i><span>SIMILIA STOCK</span></div>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="body">
    <header class="top">
      <button class="icon" id="menu" aria-label="Toggle navigation"><i data-lucide="menu"></i></button>
      <h1 id="title">Dashboard</h1>
      <label class="search"><i data-lucide="search"></i><input id="gs" type="search" placeholder="Search products" aria-label="Search products"></label>
      <a class="icon bell" href="#alerts" aria-label="Alerts"><i data-lucide="bell"></i><b id="bc" hidden></b></a>
      <div class="me"><span id="uname"></span><div class="av"><i data-lucide="user"></i></div></div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<dialog id="dlg"><form method="dialog"><p id="dmsg"></p><div class="row"><button class="btn" value="no">Cancel</button><button class="btn pri" value="yes" autofocus>Confirm</button></div></form></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="assets/js/config.js"></script>
